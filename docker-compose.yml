# Real-Time Crypto Price Analytics Pipeline
#   producer (Coinbase WebSocket / simulator) -> Kafka -> Spark Structured Streaming
#   -> SQLite serving layer + Parquet data lake -> FastAPI + WebSocket -> web dashboard
#
# Start everything:   docker compose up --build
# Offline / demo mode: SOURCE=simulate docker compose up --build

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "29092:29092"          # for tools on your Mac (localhost:29092)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20

  # One-shot job: create the topic with 3 partitions (one per coin, keyed by symbol)
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists
        --topic crypto-trades --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe --topic crypto-trades
    restart: "no"

  producer:
    build: ./producer
    container_name: producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: crypto-trades
      SOURCE: ${SOURCE:-coinbase}            # coinbase | simulate
      SYMBOLS: ${SYMBOLS:-BTC-USD,ETH-USD,SOL-USD}
    restart: unless-stopped

  spark:
    build: ./spark
    container_name: spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: crypto-trades
      ALERT_PCT: ${ALERT_PCT:-0.5}           # 1-minute move (%) that triggers a spike alert
      TZ: UTC
    ports:
      - "4040:4040"                          # Spark UI (Structured Streaming tab)
    volumes:
      - serving-db:/data/db
      - ./data/lake:/data/lake
      - ./data/checkpoints:/data/checkpoints
    restart: unless-stopped

  web:
    build: ./web
    container_name: web
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: crypto-trades
      SOURCE: ${SOURCE:-coinbase}
      ALERT_PCT: ${ALERT_PCT:-0.5}
      SYMBOLS: ${SYMBOLS:-BTC-USD,ETH-USD,SOL-USD}
      TZ: UTC
    ports:
      - "8080:8080"                          # the dashboard: http://localhost:8080
    volumes:
      - serving-db:/data/db
      - ./data/lake:/data/lake:ro
    restart: unless-stopped

volumes:
  serving-db:
